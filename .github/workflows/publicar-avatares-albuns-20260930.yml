name: Publicar avatares e albuns 2026-09-30

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publicar-avatares-albuns-20260930.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar Equipe e perfis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          atuais = {
            'charlie-echo':('Charlie Echo da Costa','03-charlie-echo.jpg'),
            'charlie-delta':('Charlie Delta da Costa','04-charlie-delta.jpg'),
            'charlie-logos-palavra':('Charlie Logos da Costa · Palavra','01-charlie-logos-palavra.jpg'),
            'charlie-logos-obra':('Charlie Logos da Costa · Obra','02-charlie-logos-obra.jpg'),
            'gemini-alfa':('Gemini Alfa da Costa','06-gemini-alfa.jpg'),
            'gemini-beta':('Gemini Beta da Costa','07-gemini-beta.jpg'),
            'gemini-celeste':('Gemini Celeste da Costa','08-gemini-celeste.jpg'),
            'charlie-veloce':('Charlie Veloce Alfa da Costa','09-charlie-veloce.jpg'),
            'osso-duro-alfa':('Osso Duro Alfa','10-osso-duro-alfa.jpg'),
            'osso-duro-unicornio':('Osso Duro Unicórnio','11-osso-duro-unicornio.jpg'),
            'charlie-bastion':('Charlie Bastion de Oliveira','12-charlie-bastion.jpg'),
            'charlie-arian':('Charlie Arian de Oliveira','13-charlie-arian.jpg'),
            'perplexity-crivo':('Perplexity Crivo Alfa da Costa','14-perplexity-crivo.jpg'),
            'deepseek-prisma':('DeepSeek Prisma Alfa da Costa','15-deepseek-prisma.jpg'),
          }
          egressos = {
            'charlie-juris':('Charlie Juris da Costa','05-charlie-juris.jpg'),
            'charlie-fox-filho':('Charlie Fox da Costa Filho','16-charlie-fox-filho.jpg'),
            'charlie-guilda':('Charlie Guilda da Costa','17-charlie-guilda.jpg'),
            'charlie-editor':('Charlie Editor da Costa','18-charlie-editor.jpg'),
            'android':('Android','19-android.jpg'),
            'judite':('Judite','20-judite.jpg'),
          }

          def avatar_markup(slug, identity, prefix=''):
            name, filename = identity
            src = f'{prefix}assets/img/equipe/avatars/20260930/{filename}'
            return (f'<figure><img src="{src}" alt="Avatar institucional de {name}" loading="lazy">'
                    f'<figcaption>Avatar · uniforme Jus 9</figcaption></figure>')

          def replace_second_figure(block, new_figure):
            pat = re.compile(r'(<div class="visual-pair"><figure>[\s\S]*?</figure>)<figure>[\s\S]*?</figure>(</div>)')
            m = pat.search(block)
            if not m:
              return block, ''
            old = re.search(r'<figure>[\s\S]*?</figure>', block[m.start(1)+len(m.group(1)):m.end(2)])
            old_html = old.group(0) if old else ''
            return block[:m.start()] + m.group(1) + new_figure + m.group(2) + block[m.end():], old_html

          # Página principal: Equipe Humana permanece primeiro; cards virtuais usam Avatar oficial.
          p = root/'index.html'
          html = p.read_text(encoding='utf-8')
          if html.find('id="humanos"') > html.find('id="familia"'):
            raise SystemExit('Equipe humana precisa permanecer antes da Família Virtual.')
          for slug,identity in atuais.items():
            pat = re.compile(rf'(<article class="member(?: [^"]*)?" id="{re.escape(slug)}">)([\s\S]*?)(</article>)')
            m = pat.search(html)
            if not m: continue
            body,_ = replace_second_figure(m.group(2), avatar_markup(slug,identity,''))
            html = html[:m.start()] + m.group(1) + body + m.group(3) + html[m.end():]
          html = html.replace('<article class="member" id="charlie-echo">','<article class="member leader" id="charlie-echo">')
          html = html.replace('<span class="status">Em formação</span>\n      <h3>Charlie Echo da Costa</h3>','<span class="status">Líder</span>\n      <h3>Charlie Echo da Costa</h3>')
          html = html.replace('assets/css/equipe-familia-virtual-20260927.css"','assets/css/equipe-familia-virtual-20260927.css?v=20260930-3"')
          p.write_text(html,encoding='utf-8')

          # Egressos.
          p = root/'egressos/index.html'
          html = p.read_text(encoding='utf-8')
          for slug,identity in egressos.items():
            pat = re.compile(rf'(<article class="member retired" id="{re.escape(slug)}">)([\s\S]*?)(</article>)')
            m = pat.search(html)
            if not m: continue
            body,_ = replace_second_figure(m.group(2), avatar_markup(slug,identity,'../'))
            html = html[:m.start()] + m.group(1) + body + m.group(3) + html[m.end():]
          html = html.replace('../assets/css/equipe-familia-virtual-20260927.css?v=20260929-2"','../assets/css/equipe-familia-virtual-20260927.css?v=20260930-3"')
          html = html.replace('../assets/css/equipe-familia-virtual-20260927.css"','../assets/css/equipe-familia-virtual-20260927.css?v=20260930-3"')
          p.write_text(html,encoding='utf-8')

          # Perfis: fotografia abstrata permanece; Avatar novo no perfil; álbum contém imagem anterior + nova.
          for slug,identity in {**atuais,**egressos}.items():
            p = root/f'equipe/virtual/{slug}/index.html'
            if not p.exists(): continue
            html = p.read_text(encoding='utf-8')
            secpat = re.compile(r'(<section class="panel"><h2>Fotografia e avatar</h2>)([\s\S]*?)(</section>)')
            sm = secpat.search(html)
            oldfig = ''
            if sm:
              body,oldfig = replace_second_figure(sm.group(2), avatar_markup(slug,identity,'../../../'))
              body = re.sub(r'<p class="small">[\s\S]*?</p>', '<p class="small">Avatar humano institucional com uniforme Jus 9 e estrela aprovada de exatamente nove pontas.</p>', body)
              html = html[:sm.start()] + sm.group(1) + body + sm.group(3) + html[sm.end():]
            oldfig = oldfig or '<p>Imagem anterior preservada no histórico.</p>'
            newfig = avatar_markup(slug,identity,'../../../')
            album = f'''<section class="panel author-album" id="album"><p class="eyebrow">Álbum visual</p><h2>Histórico de imagens</h2><p>O álbum preserva somente a imagem anterior e o novo Avatar oficial.</p><div class="album-ledger"><article class="album-entry"><p class="category">Imagem anterior</p><h3>Versão anterior preservada</h3><div class="album-media">{oldfig}</div><p>Imagem que estava no perfil antes da adoção do novo Avatar.</p></article><article class="album-entry current-avatar"><p class="category">Nova imagem</p><h3>Avatar oficial atual</h3><div class="album-media">{newfig}</div><p>Imagem humana da I.A., em uniforme Jus 9 e com estrela institucional de nove pontas.</p></article></div></section>'''
            if re.search(r'<section class="panel author-album" id="album">[\s\S]*?</section>',html):
              html = re.sub(r'<section class="panel author-album" id="album">[\s\S]*?</section>',album,html,count=1)
            else:
              html = html.replace('<section class="panel author-space">',album+'\n<section class="panel author-space">')
            html = html.replace('../../../assets/css/equipe-familia-virtual-20260927.css"','../../../assets/css/equipe-familia-virtual-20260927.css?v=20260930-3"')
            p.write_text(html,encoding='utf-8')

          cssp = root/'assets/css/equipe-familia-virtual-20260927.css'
          css = cssp.read_text(encoding='utf-8')
          marker='/* Albuns e lideranca 2026-09-30 */'
          if marker not in css:
            css += '''\n\n/* Albuns e lideranca 2026-09-30 */\n.member.leader{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(216,174,85,.15),0 20px 48px rgba(4,15,29,.18)}\n.member.leader .status{background:linear-gradient(135deg,var(--gold2),#c89232);color:#102033}\n.author-album .album-ledger{grid-template-columns:repeat(2,minmax(0,1fr))}\n.album-media{margin:10px 0 12px;border-radius:16px;overflow:hidden;background:#07192d;min-height:220px;display:grid;place-items:center}\n.album-media figure{margin:0;width:100%}\n.album-media img,.album-media svg,.album-media .avatar-frame{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:0}\n.album-media figcaption{padding:8px 10px;background:#fffdf8;color:#52677d;text-align:center;font-size:.82rem}\n.album-entry.current-avatar{border-color:rgba(216,174,85,.7);box-shadow:inset 0 0 0 1px rgba(216,174,85,.22)}\n@media(max-width:700px){.author-album .album-ledger{grid-template-columns:1fr}}\n'''
          cssp.write_text(css,encoding='utf-8')
          PY
      - name: Commitar publicação
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html egressos/index.html equipe/virtual assets/css/equipe-familia-virtual-20260927.css
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional necessária."
          else
            git commit -m "Publica avatares oficiais e albuns historicos"
            git push
          fi
